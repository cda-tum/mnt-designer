[build-system]
requires = [
    "setuptools>=77.0.3",
    "setuptools-scm>=8.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "mnt.designer"
description = "MNT Designer - An MNT tool for designing FCN circuits"
readme = "README.md"
authors = [
    { name = "Simon Hofmann", email = "simon.t.hofmann@tum.de" },
]
keywords = ["MNT", "field-coupled nanocomputing", "design"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]

dependencies = [
    "flask>=3.0.0",
    "mnt.pyfiction>=0.9.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
test = ["pytest>=8.2.1"]
coverage = ["mnt.designer[test]", "pytest-cov"]

[project.scripts]
"mnt.designer" = "mnt.designer.app:main"
"mnt-designer" = "mnt.designer.app:main"

[project.urls]
Homepage = "https://github.com/cda-tum/mnt-designer"
"Bug Tracker" = "https://github.com/cda-tum/mnt-designer/issues"
Discussions = "https://github.com/cda-tum/mnt-designer/discussions"
Research = "https://www.cda.cit.tum.de/research/nanotech/"

[tool.setuptools]
# Keep editable installs compatible with mnt.pyfiction's shared namespace.
package-dir = { "mnt" = "src/mnt" }
packages = ["mnt", "mnt.designer"]
include-package-data = false

[tool.setuptools.package-data]
"mnt.designer" = [
    "templates/*.html",
    "static/*.ico",
    "static/*.svg",
    "static/css/*.css",
    "static/js/*.js",
    "static/gates/*.svg",
]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["mnt.designer"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1

[tool.ruff]
line-length = 120
namespace-packages = ["src/mnt"]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I", "UP", "B"]
