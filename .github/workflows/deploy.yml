name: Deploy to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Use the refreshed OS roots instead of Node's bundled certificate snapshot.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Authenticate the bootstrap even if the preinstalled pip still trusts compromised CAs.
  PIP_BOOTSTRAP_URL: https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - &refresh-certificates
        name: Refresh system certificates
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --only-upgrade --yes ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - &bootstrap-pip
        name: Bootstrap patched pip
        run: python -m pip install --upgrade "pip @ $PIP_BOOTSTRAP_URL"
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit "virtualenv>=21.14.12" "certifi>=2026.10.19"
          pre-commit run --all-files --show-diff-on-failure
      - name: Test frontend handlers
        run: node tests/frontend_smoke.cjs

  build_wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - *refresh-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
        name: Install Python
      - *bootstrap-pip
      - &install-build-tools
        name: Install build tools
        run: python -m pip install "build>=1.5.0" twine "certifi>=2026.10.19"
      - name: Build wheel
        run: python -m build --wheel
      - name: Check wheel
        run: python -m twine check dist/*.whl
      - name: Install and test wheel
        run: |
          python -m pip install --verbose --only-binary=mnt.pyfiction pytest dist/*.whl
          python -m pip check
          python -m pytest
          mnt-designer --help
          mnt.designer --help
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-wheel
          path: dist/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - *refresh-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
        name: Install Python
      - *bootstrap-pip
      - *install-build-tools
      - name: Build sdist
        run: python -m build --sdist
      - name: Check source distribution
        run: python -m twine check dist/*.tar.gz
      - name: Install and test source distribution
        run: |
          python -m pip install --verbose --only-binary=mnt.pyfiction pytest dist/*.tar.gz
          python -m pip check
          python -m pytest
          mnt-designer --help
          mnt.designer --help
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  sidb_integration:
    name: Optional SiDB gate design
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    permissions:
      contents: read
    steps:
      - *refresh-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.13"
      - *bootstrap-pip
      - name: Install uv
        run: python -m pip install "uv>=0.13.4"
      # Reuse compiled dependencies, never an installed environment or Designer itself.
      # The workflow hash also invalidates the cache when build flags or tooling change.
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: sidb-ubuntu-24.04-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-sidb-design.txt', 'pyproject.toml', '.github/workflows/deploy.yml') }}
      - name: Install timeout-enabled pyfiction and Designer
        timeout-minutes: 15
        run: uv pip install --python "$(command -v python)" --override requirements-sidb-design.txt -e '.[test]'
      - name: Verify native bindings
        run: python -c "from mnt.designer.sidb_design import available; assert available(), 'Native SiDB timeout API is missing'"
      - name: Minimize native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: uv cache prune --ci
      # A later test failure must not discard a successfully compiled dependency.
      - name: Save native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Test Designer with native SiDB support
        timeout-minutes: 5
        run: |
          python -m pytest --durations=10

  upload_pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: 🚀 Deploy to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mnt.designer
    permissions:
      id-token: write
    needs: [quality, build_wheel, build_sdist, sidb_integration]
    steps:
      - *refresh-certificates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
