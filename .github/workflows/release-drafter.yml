name: 📝 Release · Draft

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

env:
  # TODO(emudhra): remove incident-specific setup only after runner/client verification; see #29.
  # Use the refreshed OS roots instead of Node's bundled certificate snapshot.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  update_release_draft:
    name: 📝 Update release draft
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - &refresh-certificates
        name: Refresh system certificates
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade --yes ca-certificates
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0

  auto_label:
    name: 🏷️ Label pull request
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - *refresh-certificates
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
